zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: f929f99c792d4f3995ae34dd05ccefc7
      template: Template_Anycast_DNS_BGP
      name: Template_Anycast_DNS_BGP
      description: |
        Экземпляр anycast DNS с анонсом по eBGP (FRR) и службой anycast-dns-health.
        Схема: network-design, «Anycast DNS — решения».
        Требуется: Zabbix agent (active); SNMP-интерфейс узла (snmpd master agentx, bgpd -M snmp).
      groups:
        - name: Templates/Applications
      items:
        - uuid: 4057b43bacbf4f1babd3aec332d61d05
          name: 'Anycast DNS: процессы bgpd'
          type: ZABBIX_ACTIVE
          key: 'proc.num[bgpd,frr]'
          delay: 1m
          history: 30d
          tags:
            - tag: component
              value: anycast-dns
          triggers:
            - uuid: 1e9d97c4817941cfa2214ec0ee1324a9
              expression: 'count(/Template_Anycast_DNS_BGP/proc.num[bgpd,frr],#2,"eq",0)=2'
              name: 'Anycast DNS: bgpd не запущен'
              priority: HIGH
              description: 'Экземпляр не анонсирует адрес anycast; адрес обслуживают остальные экземпляры.'
        - uuid: f9d616389fa74e1abfce3c8b7c97d395
          name: 'Anycast DNS: процессы anycast-dns-health'
          type: ZABBIX_ACTIVE
          key: 'proc.num[,root,,/usr/local/sbin/anycast-dns-health$]'
          delay: 1m
          history: 30d
          tags:
            - tag: component
              value: anycast-dns
          triggers:
            - uuid: ab3c46127b194f7ba2e4d11fc0cc3be8
              expression: 'count(/Template_Anycast_DNS_BGP/proc.num[,root,,/usr/local/sbin/anycast-dns-health$],#2,"eq",0)=2'
              name: 'Anycast DNS: служба anycast-dns-health не запущена'
              priority: HIGH
              description: 'При зависании named анонс не снимается.'
        - uuid: d581b760a2ac4282a381fc994e1477f9
          name: 'Anycast DNS: журнал anycast-dns-health'
          type: ZABBIX_ACTIVE
          key: 'log[/var/log/messages,anycast-dns-health,,,skip]'
          delay: 1m
          history: 30d
          value_type: LOG
          trends: '0'
          tags:
            - tag: component
              value: anycast-dns
          triggers:
            - uuid: 1756b9d024e54b65a1fb38345010ba65
              expression: 'find(/Template_Anycast_DNS_BGP/log[/var/log/messages,anycast-dns-health,,,skip],10m,"like","проверка неисправна")=1'
              name: 'Anycast DNS: проверка здоровья неисправна'
              priority: HIGH
              manual_close: 'YES'
              description: 'Проверка не может опросить named (dig отсутствует или ошибка вызова); состояние frr не меняется.'
      discovery_rules:
        - uuid: c20858a519c7425ba702752c14e0702c
          name: 'BGP: соседи'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#BGP_PEER},1.3.6.1.2.1.15.3.1.7]'
          key: anycast.bgp.peer.discovery
          delay: 1h
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 435b796a39c24046bcb4f8c1cf7df6ef
              name: 'BGP: состояние сессии с {#BGP_PEER}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.15.3.1.2.{#SNMPINDEX}'
              key: 'anycast.bgpPeerState[{#BGP_PEER}]'
              delay: 1m
              history: 30d
              valuemap:
                name: 'BGP peer state'
              tags:
                - tag: component
                  value: anycast-dns
              trigger_prototypes:
                - uuid: 87b0248b465b4e47bd0d4dd884eb5ab6
                  expression: 'count(/Template_Anycast_DNS_BGP/anycast.bgpPeerState[{#BGP_PEER}],#2,"ne",6)=2'
                  name: 'Anycast DNS: сессия BGP с {#BGP_PEER} не установлена'
                  priority: HIGH
                  description: 'Анонс через этот коммутатор отсутствует; остаётся второй коммутатор пары.'
      valuemaps:
        - uuid: b80a14e032184ffeb52bf7be2e93dd01
          name: 'BGP peer state'
          mappings:
            - value: '1'
              newvalue: idle
            - value: '2'
              newvalue: connect
            - value: '3'
              newvalue: active
            - value: '4'
              newvalue: opensent
            - value: '5'
              newvalue: openconfirm
            - value: '6'
              newvalue: established
