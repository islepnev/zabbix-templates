zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4918b88734c54bd094cff7585b5d71fc
      name: 'Templates/Network Devices'
  templates:
    - uuid: 651fe869b8f14045a95bf9a57706563c
      template: 'Device - MEINBERG LANTIME'
      name: 'Device - MEINBERG LANTIME'
      groups:
        - name: 'Templates/Network Devices'
      items:
        - uuid: 256fd007022c48e6b4f97a358205a6f2
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.0.2.0
          key: mbgLtNgFirmwareVersion
          delay: 1h
          history: 1d
          value_type: TEXT
          trends: '0'
          description: 'Installed LANTIME firmware version.'
          tags:
            - tag: Application
              value: Information
          triggers:
            - uuid: 74fdbeb64e5148828447635bc2a4c1a5
              expression: '(last(/Device - MEINBERG LANTIME/mbgLtNgFirmwareVersion,#1)<>last(/Device - MEINBERG LANTIME/mbgLtNgFirmwareVersion,#2))>0'
              name: 'Firmware Version Changed'
              priority: WARNING
              description: 'Firmware version has changed'
        - uuid: 944ea3541c5f498e94f9ca81b6b6bd35
          name: 'Total Clients'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.3.0
          key: mbgLtNgNtpCCNumberOfClients
          delay: 1h
          history: 1w
          trends: '0'
          units: Clients
          description: 'Total number of different clients requesting time.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: b9f829dacac84aec9099c94c97cf897d
          name: 'Statistic Start Time'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.1.0
          key: mbgLtNgNtpCCStartedAt
          delay: 1h
          history: 1w
          trends: '0'
          units: unixtime
          description: 'Start time of current NTP client counter session as timestamp.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: 600db99158f14c638f2afa885f10100d
          name: 'Total Today''s Clients'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.8.0
          key: mbgLtNgNtpCCTodaysClients
          delay: 1h
          history: 1w
          trends: '0'
          units: Clients
          description: 'Today''s number of different clients requesting time.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: 02a568d60c9541888c63e8aed60c12ad
          name: 'Total Requests'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.4.0
          key: mbgLtNgNtpCCTotalRequests
          delay: 1h
          history: 1w
          trends: '0'
          units: Requests
          description: 'Total requests since starting of the daemon.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: 52c688527e914590b1f3a380d5545cae
          name: 'Total Requests Today'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.5.0
          key: mbgLtNgNtpCCTotalRequestsCurrentDay
          delay: 1h
          history: 1w
          trends: 90d
          units: Requests
          description: 'Today''s total requests'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: 284a4a44e3c74a418489a148413b9748
          name: 'Total Requests Last Hour'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.6.0
          key: mbgLtNgNtpCCTotalRequestsLastHour
          delay: 1h
          history: 1w
          trends: '0'
          units: Requests
          description: 'Today''s requests within the last completed hour.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: af2a78593b514983b30f784af1524771
          name: 'Total Requests Last Minute'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.8.7.0
          key: mbgLtNgNtpCCTotalRequestsLastMinute
          history: 1w
          trends: '0'
          units: Requests
          description: 'Today''s requests within the last completed minute.'
          tags:
            - tag: Application
              value: 'NTP Statistic'
        - uuid: cd404ea1cc7a4c45822c5f950197bbc6
          name: 'NTP Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.1.0
          key: mbgLtNgNtpCurrentState
          history: 1w
          trends: 90d
          description: 'Current NTP''s synchronization status.'
          valuemap:
            name: 'MBG-LANTIME-NG-MIB::mbgLtNgNtpCurrentState'
          tags:
            - tag: Application
              value: NTP
          triggers:
            - uuid: ccb200e75a224175a584350b763075e2
              expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgNtpCurrentState)=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/Device - MEINBERG LANTIME/mbgLtNgNtpCurrentState, {$SENSOR_RECOVERY_TIME})=2'
              name: 'NTP not synchronized'
              priority: AVERAGE
        - uuid: 25b0fb511dcf4e848506947dcf305d09
          name: 'NTP Reference Clock'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.3.0
          key: mbgLtNgNtpRefclockName
          delay: 1h
          history: 1d
          value_type: CHAR
          trends: '0'
          description: 'Name of the current refclock by the NTP.'
          tags:
            - tag: Application
              value: NTP
        - uuid: a7c5b90ee5384d2d8efe780fe8f9af39
          name: 'NTP Reference Clock Offset'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.4.0
          key: mbgLtNgNtpRefclockOffset
          history: 1w
          value_type: FLOAT
          trends: 90d
          units: ms
          description: 'Time offset between the current selected refclock and time of NTP as string in milliseconds'
          preprocessing:
            - type: RTRIM
              parameters:
                - ' ms'
          tags:
            - tag: Application
              value: ReferenceClock
        - uuid: 0441f568231b4dfca52163d2c16b2934
          name: 'NTP Stratum'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.2.2.0
          key: mbgLtNgNtpStratum
          delay: 1h
          history: 1d
          trends: '0'
          description: 'Stratum value of the NTP.'
          tags:
            - tag: Application
              value: NTP
          triggers:
            - uuid: 65338126556c4093b394f9a57529d78a
              expression: 'avg(/Device - MEINBERG LANTIME/mbgLtNgNtpStratum,#5)>4'
              name: 'Clock Stratum unreliable'
              priority: WARNING
              description: |
                Trigger on stratum higher than 4 for the last 5 checks.
                
                By default Stratum when unsynced is 12. The trigger will fire in 2 cases:
                
                 * First start (full cold boot) - no ephemeridis and no sync
                 * Severe degradation of sync and/or severe faults
        - uuid: ce2f85a418b240768e2cda2565540bfc
          name: 'Number of RefClocks'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.1.1.0
          key: mbgLtNgNumberOfRefclocks
          delay: 1h
          history: 90d
          description: 'Number of reference clocks Available. Includes all possible ones (e.g. gps + irig)'
          tags:
            - tag: Application
              value: ReferenceClock
        - uuid: 925fee1cf54445948357edc64e3ce690
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.0.3.0
          key: mbgLtNgSerialNumber
          delay: 1h
          history: 1d
          value_type: TEXT
          trends: '0'
          description: 'LANTIME serial number.'
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: Information
        - uuid: d5149816259549b3ae0de615044e8741
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.5597.30.0.5.2.1.0
          key: mbgLtNgSysTempCelsius
          history: 30d
          trends: 90d
          units: °C
          description: 'Temperature in degree Celsius'
          tags:
            - tag: Application
              value: Environmental
          triggers:
            - uuid: 182a26e37d1548ad8c1ed84e55247d45
              expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgSysTempCelsius)>={$MBG_INTERNAL_TEMP_CRITICAL}'
              name: 'Temperature too high > {$MBG_INTERNAL_TEMP_CRITICAL}'
              priority: HIGH
            - uuid: adf8b656f75f40079b7cf9b8932cb839
              expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgSysTempCelsius)>={$MBG_INTERNAL_TEMP_HIGH}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgSysTempCelsius)<{$MBG_INTERNAL_TEMP_HIGH}-3'
              name: 'Temperature too high > {$MBG_INTERNAL_TEMP_HIGH}'
              priority: AVERAGE
              dependencies:
                - name: 'Temperature too high > {$MBG_INTERNAL_TEMP_CRITICAL}'
                  expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgSysTempCelsius)>={$MBG_INTERNAL_TEMP_CRITICAL}'
        - uuid: c73e2ce1b0a540d88899ff5c4270c6b3
          name: 'Refclock Mode'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5597.3.2.4.0
          key: mbgLtRefClockMode
          delay: 5m
          history: 1d
          description: |
            "current mode of refclock connected to NTP time server as value"
                --- " 0: not available"
                --- " 1: Normal Operation"
                --- " 2: Tracking/Searching"
                --- " 3: Antenna Faulty"
                --- " 4: Warm Boot"
                --- " 5: Cold Boot"
                --- " 6: Antenna Short Circuit"
          valuemap:
            name: 'Meinberg mbgLtRefClockModeVal MAP'
          tags:
            - tag: Application
              value: NTP
          triggers:
            - uuid: 5dd5ad369e38454dad49fe822f1b1bc7
              expression: 'last(/Device - MEINBERG LANTIME/mbgLtRefClockMode)=3 or last(/Device - MEINBERG LANTIME/mbgLtRefClockMode)=6'
              name: 'Antena Fault'
              priority: HIGH
              description: 'Trigger on Antena Fault or ShortCircuit'
      discovery_rules:
        - uuid: 18c75a494c2348e19a119121a955ff85
          name: 'Cluster Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.5597.30.0.6.2.1.1]'
          key: mbgLtNgClusterIndex
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: e2bf165be77045dc8e0b0a0cfaf10247
              name: 'Clock Class'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.7.{#SNMPINDEX}'
              key: 'mbgLtNgClusterClockClass[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              trends: 90d
              description: 'Reference''s clock class'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgClusterClockClass'
              tags:
                - tag: Application
                  value: Cluster
            - uuid: 994532277d824c73b029541ff0c6e0ef
              name: 'Clock Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.8.{#SNMPINDEX}'
              key: 'mbgLtNgClusterClockStatus[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              trends: 90d
              description: 'Reference''s clock status'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgClusterClockStatus'
              tags:
                - tag: Application
                  value: Cluster
              trigger_prototypes:
                - uuid: 2129079a7cf540c4bcfbbfbaae88a5d7
                  expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgClusterClockStatus[{#SNMPINDEX}])=3'
                  name: 'Cluster Clock in Failure State'
                  priority: AVERAGE
            - uuid: 387c09a1330e49d585c0f9dbfd61b7ec
              name: Falseticker
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.10.{#SNMPINDEX}'
              key: 'mbgLtNgClusterIsFalseticker[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              trends: 90d
              description: 'Am I a falseticker?'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgClusterIsFalseticker'
              tags:
                - tag: Application
                  value: Cluster
            - uuid: 6b58b1f176ca427893fbe10df167170e
              name: Priority
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.6.{#SNMPINDEX}'
              key: 'mbgLtNgClusterMasterPriority[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: 90d
              description: 'Priority of cluster master'
              tags:
                - tag: Application
                  value: Cluster
            - uuid: ed3c572f330241e28d7bf4df02d518b6
              name: 'Member State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.3.{#SNMPINDEX}'
              key: 'mbgLtNgClusterPortState[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              trends: 90d
              description: 'State of cluster'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgClusterPortState'
              tags:
                - tag: Application
                  value: Cluster
              trigger_prototypes:
                - uuid: 24fa42eec7b1480bb17728efa924c8ce
                  expression: '(last(/Device - MEINBERG LANTIME/mbgLtNgClusterPortState[{#SNMPINDEX}],#1)<>last(/Device - MEINBERG LANTIME/mbgLtNgClusterPortState[{#SNMPINDEX}],#2))=1'
                  name: 'Cluster membership change'
                  priority: INFO
            - uuid: ae61d3b088b04fcf89e2736732fad47e
              name: 'Reconfiguration State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.6.2.1.9.{#SNMPINDEX}'
              key: 'mbgLtNgClusterReconfigurationState[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              trends: 90d
              description: 'Current reconfiguration state'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgClusterReconfigurationState'
              tags:
                - tag: Application
                  value: Cluster
              trigger_prototypes:
                - uuid: 1597d9f90eb14cab8c01518cd1f37141
                  expression: '(last(/Device - MEINBERG LANTIME/mbgLtNgClusterReconfigurationState[{#SNMPINDEX}],#1)<>last(/Device - MEINBERG LANTIME/mbgLtNgClusterReconfigurationState[{#SNMPINDEX}],#2))=1'
                  name: 'Cluster reconfiguration state change'
                  priority: INFO
        - uuid: be203b639b3242588b4a231b152da800
          name: 'PTP Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.5597.30.0.3.2.1.1,{#PORTSTATE},1.3.6.1.4.1.5597.30.0.3.2.1.3]'
          key: mbgLtNgPtpIndex
          delay: 1h
          filter:
            conditions:
              - macro: '{#PORTSTATE}'
                value: '3'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 1ebb17e7304945d184ef135e578f0f9c
              name: 'PTP Module - {#SNMPVALUE} - Availability'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.20.{#SNMPINDEX}'
              key: 'mbgLtNgPtpAvail[{#SNMPINDEX}]'
              history: 30d
              trends: 90d
              description: 'Signals whether PTP instance is avail or not'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgPtpAvail'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 5eb11c6420ea444ba0338f30f8279d06
              name: 'PTP Module - {#SNMPVALUE} - Clock Accuracy'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.5.{#SNMPINDEX}'
              key: 'mbgLtNgPtpClockAccuracy[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              description: 'Indicates the source of time'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgPtpClockAccuracy'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 23e7d8f8c60a4152a0f6d9806949ccda
              name: 'PTP Module - {#SNMPVALUE} - Clock Class'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.6.{#SNMPINDEX}'
              key: 'mbgLtNgPtpClockClass[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              trends: '0'
              description: 'Denotes the traceability of the time or frequency'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: ec59283c90eb4d15a9b13ff9bc59246e
              name: 'PTP Module - {#SNMPVALUE} - Asymmetric Network Delay'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.19.{#SNMPINDEX}'
              key: 'mbgLtNgPtpDelayAsymmetry[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              units: ns
              description: 'Asymmetric network delay in nanoseconds'
              preprocessing:
                - type: RTRIM
                  parameters:
                    - ' ns'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 052786c92f2d4927ae869a05a0be6173
              name: 'PTP Module - {#SNMPVALUE} - Delay Mechanism'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.15.{#SNMPINDEX}'
              key: 'mbgLtNgPtpDelayMec[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              description: 'Delay mechanism'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgPtpDelayMec'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 25cd9f25ef854dc58b3bddf41e5d42d3
              name: 'PTP Module - {#SNMPVALUE} - Grandmaster MAC'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.4.{#SNMPINDEX}'
              key: 'mbgLtNgPtpGrandmasterMac[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: TEXT
              trends: '0'
              description: 'MAC address of current grandmaster'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 860e0ebc655f4099b49813e6c8194927
              name: 'PTP Module - {#SNMPVALUE} - Grandmaster Offset'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.8.{#SNMPINDEX}'
              key: 'mbgLtNgPtpOffsetFromGM[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              units: ns
              description: 'Offset from grandmaster in nanoseconds'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 613ff090e7b842a38166a1d99bb873b9
              name: 'PTP Module - {#SNMPVALUE} - Network Delay'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.14.{#SNMPINDEX}'
              key: 'mbgLtNgPtpPathDelay[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              units: ns
              description: 'Network delay in nanoseconds'
              preprocessing:
                - type: RTRIM
                  parameters:
                    - ' ns'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 4b6b080a18e446f19314dd720afedaa3
              name: 'PTP Module - {#SNMPVALUE} - Port Link Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.12.{#SNMPINDEX}'
              key: 'mbgLtNgPtpPortLinkup[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              description: 'PTP port''s physical link-up'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgPtpPortLinkup'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 1f90d78373dd4148bc5707e24cb2893d
              name: 'PTP Module - {#SNMPVALUE} - State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.3.{#SNMPINDEX}'
              key: 'mbgLtNgPtpPortState[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: 90d
              description: 'Port state as integer'
              valuemap:
                name: 'MBG-LANTIME-NG-MIB::mbgLtNgPtpPortState'
              tags:
                - tag: Application
                  value: 'PTP Module'
              trigger_prototypes:
                - uuid: d2b9e897926c45c689f80504aacc3cd3
                  expression: 'last(/Device - MEINBERG LANTIME/mbgLtNgPtpPortState[{#SNMPINDEX}])=2'
                  name: 'PTP Module - {#SNMPVALUE} - Faulty'
                  priority: AVERAGE
            - uuid: 32373bd844f14622a0202c65b5fc8f03
              name: 'PTP Module - {#SNMPVALUE} - System Time'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.11.{#SNMPINDEX}'
              key: 'mbgLtNgPtpSysTime[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: TEXT
              trends: '0'
              description: 'Current system time'
              tags:
                - tag: Application
                  value: 'PTP Module'
            - uuid: 5d4b115c8d7d4154b49e4cf25dc187b1
              name: 'PTP Module - {#SNMPVALUE} - PTP Seconds'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.5597.30.0.3.2.1.9.{#SNMPINDEX}'
              key: 'mbgLtNgPtpTimeSeconds[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              trends: '0'
              units: s
              description: 'PTP seconds'
